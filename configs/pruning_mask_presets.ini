[mask-prune-stable]
pruning.mask.enabled = true
pruning.mask.lambda_m = auto
pruning.mask.temp.init = 1.0
pruning.mask.temp.final = 0.5
pruning.mask.temp.anneal_portion = 0.6
pruning.mask.sample_trials = 10
pruning.mask.global_interval = 1000
pruning.mask.newborn_protect_cycles = 2

[mask-prune-compress]
pruning.mask.enabled = true
pruning.mask.lambda_m = auto
pruning.mask.temp.final = 0.4
pruning.mask.temp.anneal_portion = 0.6
pruning.mask.sample_trials = 8
pruning.mask.newborn_protect_cycles = 2
pruning.mask.scheduler.phase_weights = 1.0, 1.0, 1.2

[mask-prune-quality]
pruning.mask.enabled = true
pruning.mask.lambda_m = auto
pruning.mask.temp.final = 0.6
pruning.mask.sample_trials = 12
pruning.mask.newborn_protect_cycles = 3
pruning.legacy.enabled_when_mask = false
